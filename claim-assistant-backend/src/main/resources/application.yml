server:
  port: 8080

spring:
  application:
    name: claims-assistant

  data:
    mongodb:
      uri: mongodb://localhost:27017/claims_assistant

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
      embedding:
        model: nomic-embed-text

claims:
  rag:
    top-k: 5
    max-candidates: 2000
    chunk-max-chars: 1500
    chunk-overlap-chars: 200
  upload:
    dir: ./uploads
  cors:
    allowed-origin: http://localhost:4200
