server:
  port: 8080

spring:
  application:
    name: claims-assistant

  data:
    mongodb:
      uri: mongodb://localhost:27017/claims_assistant

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
      embedding:
        model: nomic-embed-text

# Simple threshold config for GoRules-style routing until the real
# GoRules SDK/table is wired in. Swap RulesEngineService's internals
# to call GoRules without touching any caller of that service.
claims:
  routing:
    auto-approve-max-amount: 50000
  upload:
    dir: ./uploads
  cors:
    allowed-origin: http://localhost:4200

# New multi-agent document validation pipeline (POST /api/docvalidation/claims).
# Separate "docvalidation.*" prefix so nothing here collides with the
# "claims.*" keys above used by the existing /api/claims/submit flow.
docvalidation:
  document:
    max-file-size: 10485760
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
  relevance:
    high-threshold: 0.80
    low-threshold: 0.60
  mongodb:
    policy-vector-index: policy_clause_vector_index
