server:
  port: 8080

spring:
  application:
    name: claims-assistant

  data:
    mongodb:
      uri: mongodb://localhost:27017/claim_assistant

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b
        options:
          keep-alive: 10m
          num-predict: 1024
      embedding:
        model: nomic-embed-text

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

# Simple threshold config for GoRules-style routing until the real
# GoRules SDK/table is wired in. Swap RulesEngineService's internals
# to call GoRules without touching any caller of that service.
claims:
  routing:
    auto-approve-max-amount: 50000
  upload:
    dir: ./uploads
  cors:
    allowed-origin: http://localhost:4200

# New multi-agent document validation pipeline (POST /api/docvalidation/claims).
# Separate "docvalidation.*" prefix so nothing here collides with the
# "claims.*" keys above used by the existing /api/claims/submit flow.
docvalidation:
  ingestion:
    enabled: true
    medical-policy-path: RAG_IngestionPolicyPdfs/Medical_Insurance_Policy_ClaimXpert.pdf
    travel-policy-path: RAG_IngestionPolicyPdfs/Travel_Insurance_Policy_ClaimXpert.pdf
  document:
    max-file-size: 10485760
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
  mongodb:
    policy-vector-index: policy_clause_vector_index
  rag:
    top-k: 8
  decision:
    max-ocr-chars-per-doc: 4000

app:
  notification:
    primary:
      username: rupalijain046@gmail.com        # replace with your primary Gmail address
      password: cdnw npma mhys mxmc      # replace with your primary Gmail App Password
    fallback:
      username: fallback@gmail.com       # replace with your fallback Gmail address
      password: abcd efgh ijkl mnop      # replace with your fallback Gmail App Password

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nextgen.claims.docvalidation.agent.ClaimDecisionAgent: DEBUG
