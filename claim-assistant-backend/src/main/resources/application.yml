server:
  port: 8080
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always

spring:
  application:
    name: claims-assistant

  data:
    mongodb:
      uri: mongodb+srv://sumathiatk_db_user:RgMAx9khPIVoic5Y@claimxpert.1z43iyi.mongodb.net/claims_assistant

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b-instruct-q4_K_M
      embedding:
        model: nomic-embed-text

# Simple threshold config for GoRules-style routing until the real
# GoRules SDK/table is wired in. Swap RulesEngineService's internals
# to call GoRules without touching any caller of that service.
claims:
  routing:
    auto-approve-max-amount: 50000
  upload:
    dir: ./uploads
  cors:
    allowed-origin: http://localhost:4200
  # ValidationAgent's per-file document check overrides the app-wide chat
  # model with this one - qwen3.5:9b is a "thinking" model with no way to
  # disable reasoning in this Spring AI version, so it's too slow for a
  # per-file loop. Needs `ollama pull qwen2.5:3b` (or whatever is set here).
  validation:
    model: qwen2.5:3b
  # ClaimDecisionAgent's final claim-level verdict (POST /api/claims pipeline):
  # below this average confidence -> UNDER_REVIEW regardless of the per-document verdicts.
  decision:
    confidence-threshold: 0.65
  # PolicyClauseSeeder: productType -> classpath PDF filename to seed policy_clause_vectors
  # from at startup (once per productType - skipped if that productType already has clauses).
  # Add a new product's policy PDF here, not in Java code.
  # Set enabled: false once ingestion is done and you don't want this running at all anymore.
  policy-seed:
    enabled: true
    pdfs:
      MEDICAL: medical_claims_policy.pdf
      TRAVEL: travel_claims_policy.pdf

# POST /api/claims multi-agent pipeline (ClaimOrchestrator / DocumentAgent / DocumentRelevanceAgent).
document:
  max-file-size: 10485760 # 10 MB

relevance:
  high-threshold: 0.80 # embedding cosine similarity >= this -> RELATED, no Ollama call
  low-threshold: 0.60  # below this -> UNRELATED, no Ollama call; in between -> Ollama decides

# Tesseract native OCR engine (OcrExtractionService fallback for scanned PDFs/images).
# Leave datapath blank to use the system default (TESSDATA_PREFIX env var / OS install).
tesseract:
  datapath: ""
  language: eng
