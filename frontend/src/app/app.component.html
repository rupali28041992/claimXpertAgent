<!-- Header: hidden on login page -->
@if (authService.isLoggedIn) {
<header class="page-header">
  <div class="page-header-inner">

    <a class="page-logo" routerLink="/home">
      <svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 2L5 8.5V17c0 8.3 5.6 15.9 13 17.8 7.4-1.9 13-9.5 13-17.8V8.5L18 2z" fill="#1a365d"/>
        <path d="M18 4.5L7.5 10V17c0 7.1 4.7 13.6 10.5 15.4C23.8 30.6 28.5 24.1 28.5 17V10L18 4.5z" fill="#2a69ac"/>
        <path d="M11.5 18.5l4 4 9-9" stroke="#ffffff" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      ClaimXpert
    </a>

    <nav class="page-nav">
      <a routerLink="/file-claim"
         routerLinkActive="nav-active">
        File a Claim
      </a>
      <a routerLink="/status"
         routerLinkActive="nav-active">
        Check Status of Claim
      </a>
    </nav>

    <div class="page-user">
      <span class="user-dot"></span>
      <span class="user-name">{{ authService.currentUser?.name }}</span>
      <button class="btn-logout" type="button" (click)="logout()">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M13 3h4a1 1 0 011 1v12a1 1 0 01-1 1h-4"/>
          <polyline points="10 15 14 10 10 5"/>
          <line x1="1" y1="10" x2="14" y2="10"/>
        </svg>
        Logout
      </button>
    </div>

  </div>
</header>
}

<main class="page-main">
  <router-outlet></router-outlet>
</main>

@if (authService.isLoggedIn) {
<footer class="page-footer">
  <div class="page-footer-inner">

    <div class="footer-brand">
      <svg viewBox="0 0 36 36" width="18" height="18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 2L5 8.5V17c0 8.3 5.6 15.9 13 17.8 7.4-1.9 13-9.5 13-17.8V8.5L18 2z" fill="#64748b"/>
        <path d="M18 4.5L7.5 10V17c0 7.1 4.7 13.6 10.5 15.4C23.8 30.6 28.5 24.1 28.5 17V10L18 4.5z" fill="#94a3b8"/>
        <path d="M11.5 18.5l4 4 9-9" stroke="#ffffff" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      ClaimXpert Portal
    </div>

    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">FAQs</a>
      <a href="#">Contact Support</a>
    </div>

    <span class="footer-copy">© 2026 ClaimXpert. All rights reserved.</span>

  </div>
</footer>
}
