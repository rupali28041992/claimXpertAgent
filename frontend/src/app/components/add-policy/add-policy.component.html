<main class="portal-main">
  <div class="portal-card">

    <div class="card-header">
      <div class="card-header-left">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
            <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="white" stroke-width="1.8"/>
          </svg>
        </div>
        <div>
          <div class="card-title">Add a New Policy</div>
          <div class="card-sub">Save a policy so it can be looked up when filing a claim</div>
        </div>
      </div>
    </div>

    <div class="form-body">

      @if (!savedPolicyNumber) {
        <form [formGroup]="form" (ngSubmit)="onSave()" class="policy-form">

          <div class="form-field">
            <label>Policy Number</label>
            <input type="text" formControlName="policyNumber" placeholder="e.g. POL-2024-00123" class="field-input" />
          </div>

          <div class="form-field">
            <label>Customer ID</label>
            <input type="text" formControlName="customerId" placeholder="e.g. cust_1" class="field-input" />
          </div>

          <div class="form-field">
            <label>Claim Type</label>
            <select formControlName="claimType" class="field-select">
              <option [value]="null" disabled selected>Choose a claim type...</option>
              @for (type of claimTypes; track type) {
                <option [value]="type">{{ type }}</option>
              }
            </select>
          </div>

          <div class="form-field">
            <label>Policyholder Name</label>
            <input type="text" formControlName="policyholderName" placeholder="e.g. Rajesh Kumar" class="field-input" />
          </div>

          <div class="form-field">
            <label>Sum Insured</label>
            <input type="number" formControlName="sumInsured" placeholder="e.g. 500000" class="field-input" />
          </div>

          <div class="form-field">
            <label>Start Date</label>
            <input type="date" formControlName="startDate" class="field-input" />
          </div>

          <div class="form-field">
            <label>End Date</label>
            <input type="date" formControlName="endDate" class="field-input" />
          </div>

          @if (saveError) {
            <div class="form-error">{{ saveError }}</div>
          }

          <button type="submit" class="btn-submit" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : 'Save Policy' }}
          </button>
        </form>
      }

      @if (savedPolicyNumber) {
        <div class="save-success">
          <div class="success-circle">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="success-title">Policy saved successfully!</div>
          <div class="success-ref">Policy Number: <strong>{{ savedPolicyNumber }}</strong></div>
          <button type="button" class="btn-primary" (click)="onAddAnother()">Add Another Policy</button>
        </div>
      }

    </div>
  </div>
</main>
